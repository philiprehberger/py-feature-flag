[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "philiprehberger-feature-flag"
version = "0.2.1"
description = "Simple feature flags with percentage rollout and user targeting."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Philip Rehberger" }]
keywords = ["feature-flag", "toggle", "rollout", "ab-test", "deployment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/philiprehberger/py-feature-flag#readme"
Repository = "https://github.com/philiprehberger/py-feature-flag"
Issues = "https://github.com/philiprehberger/py-feature-flag/issues"
Changelog = "https://github.com/philiprehberger/py-feature-flag/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/philiprehberger_feature_flag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
